# /etc/nginx/sites-available/cloud  (потом симлинк в sites-enabled)

# HTTP: только перенаправление на HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Самоподписанный сертификат (см. deploy/README.md)
    ssl_certificate     /etc/nginx/ssl/cloud.crt;
    ssl_certificate_key /etc/nginx/ssl/cloud.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Пароль на ВСЁ, включая скачивание
    auth_basic           "Cloud";
    auth_basic_user_file /etc/nginx/cloud.htpasswd;

    # Максимальный размер одной загрузки
    client_max_body_size 500m;

    # Скачивание: nginx сам читает файлы с диска, бэкенд не участвует.
    # /dl/docs/a.pdf  ->  /srv/storage/files/docs/a.pdf
    location /dl/ {
        alias /srv/storage/files/;
        disable_symlinks on;             # не идти по симлинкам
        autoindex off;                   # не показывать список папок
        add_header Content-Disposition "attachment" always;   # только скачивать
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Временные файлы незавершённых загрузок никогда не отдаём
    location ~ /\.part- {
        return 404;
    }

    # Статика фронтенда (htmx.min.js, css)
    location /static/ {
        alias /srv/cloud/static/;
    }

    # Всё остальное идёт в наш C-бэкенд
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;     # тело загрузки не копить на диске nginx
        proxy_set_header Host $host;
    }
}
